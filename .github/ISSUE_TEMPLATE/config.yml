blank_issues_enabled: false
contact_links:
  - name: Feature idea
    url: https://github.com/IftatBhuiyan/sandalphon/discussions/categories/ideas
    about: Suggest new behaviour in Discussions, where it can be talked through before anyone writes code.
  - name: Question or help
    url: https://github.com/IftatBhuiyan/sandalphon/discussions/categories/q-a
