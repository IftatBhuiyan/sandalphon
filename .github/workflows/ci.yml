name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Engine tests
        run: swift test -c release
      - name: Benchmark
        continue-on-error: true   # downloads public test sets; a network hiccup should not fail the build
        run: scripts/benchmark.sh
      - name: Build the app (ad-hoc signed)
        run: SANDALPHON_SIGN_IDENTITY=- scripts/build-app.sh --universal
      - uses: actions/upload-artifact@v4
        with:
          name: Sandalphon-unsigned
          path: build/Sandalphon-*.dmg
          retention-days: 14
